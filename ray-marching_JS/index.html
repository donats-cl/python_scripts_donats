<!-- data:text/html,<html><head><title>Ray Marching</title></head><body><canvas id="cnv"></canvas><style>*{margin: 0px;padding: 0px;}</style><script>let cnv=document.getElementById("cnv"),ctx=cnv.getContext("2d"),w=window.innerWidth,h=window.innerHeight;cnv.width=w,cnv.height=h;let ITTER=100,MAX_DIST=10;const EX=vec(.001,0,0),EY=vec(0,.001,0),EZ=vec(0,0,.001);function getDist(t){let e=dist(t,vec(0,0,0))-.9,n=.8-t.z;return Math.min(n,e)}function vec(t,e,n){return{x:t,y:e,z:n}}function dist(t,e){return Math.sqrt((t.x-e.x)**2+(t.y-e.y)**2+(t.z-e.z)**2)}function normilaze(t){let e=dist(t,vec(0,0,0));return vec(t.x/e,t.y/e,t.z/e)}function sum(t,e){return vec(t.x+e.x,t.y+e.y,t.z+e.z)}function sub(t,e){return vec(t.x-e.x,t.y-e.y,t.z-e.z)}function dot(t,e){return t.x*e.x+t.y*e.y+t.z*e.z}function mul(t,e){return vec(t.x*e,t.y*e,t.z*e)}function getAbs(t){return vec(Math.abs(t.x),Math.abs(t.y),Math.abs(t.z))}function getMax(t,e){return vec(Math.max(t.x,e),Math.max(t.y,e),Math.max(t.z,e))}function getNormal(t){let e=getDist(t);return normilaze(sub(vec(e,e,e),vec(getDist(sub(t,EX)),getDist(sub(t,EY)),getDist(sub(t,EZ)))))}function light(t){let e=normilaze(sub(vec(-5,5,-10),t));return.5*dot(getNormal(t),e)+.5}function rayMarching(t,e){let n=vec(t.x,t.y,t.z);for(let t=0;t<ITTER;t++){let t=getDist(n);if(t>MAX_DIST)break;if(n=sum(n,mul(e,t)),t<.1)return light(n)}return 0}function draw(){const t=ctx.createImageData(w,h);let e=t.data,n=vec(-2,0,0);for(let t=0;t<w;t++)for(let c=0;c<h;c++){let r=t/w*2-1,i=vec(1,r*=w/h,c/h*2-1),a=rayMarching(n,i=normilaze(i));a*=255;let u=4*(t+c*w);e[u]=a,e[u+1]=a,e[u+2]=a,e[u+3]=255}ctx.putImageData(t,0,0)}draw();</script></body></html> -->

<!-- data:text/html,<html><head><title>Ray Marching</title></head><body><canvas id="cnv"></canvas><style>*{margin: 0px;padding: 0px;}</style><script>let cnv=document.getElementById("cnv"),ctx=cnv.getContext("2d"),w=window.innerWidth,h=window.innerHeight;cnv.width=w,cnv.height=h;let ITTER=100,MAX_DIST=10;const EX=vec(.001,0,0),EY=vec(0,.001,0),EZ=vec(0,0,.001);function getDist(t){let e=dist(t,vec(0,0,0))-.9,n=.8-t.z,c=vec(0,0,0),r=sub(getAbs(t),vec(.5,1,1)),i=dist(getMax(r,0),c)+Math.min(Math.max(r.x,Math.max(r.y,r.z)),0);return Math.min(n,Math.max(-e,i))}function vec(t,e,n){return{x:t,y:e,z:n}}function dist(t,e){return Math.sqrt((t.x-e.x)**2+(t.y-e.y)**2+(t.z-e.z)**2)}function normilaze(t){let e=dist(t,vec(0,0,0));return vec(t.x/e,t.y/e,t.z/e)}function sum(t,e){return vec(t.x+e.x,t.y+e.y,t.z+e.z)}function sub(t,e){return vec(t.x-e.x,t.y-e.y,t.z-e.z)}function dot(t,e){return t.x*e.x+t.y*e.y+t.z*e.z}function mul(t,e){return vec(t.x*e,t.y*e,t.z*e)}function getAbs(t){return vec(Math.abs(t.x),Math.abs(t.y),Math.abs(t.z))}function getMax(t,e){return vec(Math.max(t.x,e),Math.max(t.y,e),Math.max(t.z,e))}function getNormal(t){let e=getDist(t);return normilaze(sub(vec(e,e,e),vec(getDist(sub(t,EX)),getDist(sub(t,EY)),getDist(sub(t,EZ)))))}function light(t){let e=normilaze(sub(vec(-5,5,-10),t));return.5*dot(getNormal(t),e)+.5}function rayMarching(t,e){let n=vec(t.x,t.y,t.z);for(let t=0;t<ITTER;t++){let t=getDist(n);if(t>MAX_DIST)break;if(n=sum(n,mul(e,t)),t<.1)return light(n)}return 0}function draw(){const t=ctx.createImageData(w,h);let e=t.data,n=vec(-2,0,0);for(let t=0;t<w;t++)for(let c=0;c<h;c++){let r=t/w*2-1,i=vec(1,r*=w/h,c/h*2-1),a=rayMarching(n,i=normilaze(i));a*=255;let u=4*(t+c*w);e[u]=a,e[u+1]=a,e[u+2]=a,e[u+3]=255}ctx.putImageData(t,0,0)}draw();</script></body></html> -->
