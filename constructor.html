<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Gameinfo ConVars Constructor</title>
    <style>
        :root {
            --bg-main: #0d0f12;
            --bg-card: #151921;
            --bg-input: #0a0c0e;
            --border: #262c38;
            --border-hover: #3b465a;
            --accent: #f0be52; /* Deadlock Gold */
            --accent-hover: #ffd67a;
            --accent-dim: rgba(240, 190, 82, 0.15);
            --text-main: #e2e8f0;
            --text-dim: #8b98a5;
            --code-bg: #090a0f;
            --danger: #ff5e5e;
            --success: #38ef7d;
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            --font-mono: 'Consolas', 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font);
            line-height: 1.4;
            padding: 20px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 480px;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        header {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #181d26 0%, #10131a 100%);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 20px 24px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .search-bar {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s border;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .category {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .category-header {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .category-header:hover {
            background: rgba(240, 190, 82, 0.05);
        }

        .cvar-list {
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cvar-item {
            display: grid;
            grid-template-columns: 280px 140px 1fr 100px;
            gap: 12px;
            align-items: center;
            padding: 8px 10px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            font-size: 0.88rem;
            transition: 0.15s background;
        }

        .cvar-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border-hover);
        }

        @media (max-width: 768px) {
            .cvar-item {
                grid-template-columns: 1fr;
                gap: 6px;
            }
        }

        .cvar-name {
            font-family: var(--font-mono);
            color: #7dd3fc;
            font-weight: 600;
            word-break: break-all;
        }

        .cvar-input input {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
        }

        .cvar-input input:focus {
            border-color: var(--accent);
        }

        .cvar-info {
            color: var(--text-dim);
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .cvar-def {
            color: #eab308;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            display: block;
            margin-top: 2px;
        }

        .fps-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            padding: 4px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .fps-huge { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .fps-med  { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid #eab308; }
        .fps-low  { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .fps-lat  { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }

        /* Output Sidebar */
        .sidebar {
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .output-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .output-box h3 {
            font-size: 1.1rem;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea#outputArea {
            width: 100%;
            height: 60vh;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #38ef7d;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 12px;
            resize: vertical;
            white-space: pre;
            overflow-x: auto;
            line-height: 1.4;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent);
            color: #000;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: 0.3s all ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>⚡ Deadlock ConVars Configurator</h1>
            <p>Генератор и кастомизатор <code>gameinfo.gi</code> ConVars с точным анализом FPS.</p>
        </div>
        <div class="actions">
            <button class="btn-secondary" onclick="resetToConfig()">Сброс к конфигу</button>
            <button class="btn-secondary" onclick="resetToDefault()">Сброс к дефолтам игры</button>
        </div>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Поиск параметра (например: r_shadows, shadow, lod, cloth, bloom)..." oninput="filterConVars()">
    </div>

    <!-- Main Configurator Left Column -->
    <div id="categoriesContainer"></div>

    <!-- Output & Actions Right Column -->
    <div class="sidebar">
        <div class="output-box">
            <h3>
                <span>Конечный блок ConVars</span>
                <span style="font-size: 0.8rem; color: var(--text-dim);" id="cvarCount">0 параметров</span>
            </h3>
            <textarea id="outputArea" readonly></textarea>
            <div class="actions">
                <button class="btn-primary" onclick="copyToClipboard()">📋 Скопировать в буфер</button>
                <button class="btn-secondary" onclick="downloadTxt()">💾 Скачать .gi / .txt</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">Скопировано в буфер обмена!</div>

// Генерация DOM элементов
const container = document.getElementById('categoriesContainer');

function getFpsBadgeClass(fpsText) {
    if (fpsText.includes('+6') || fpsText.includes('+5') || fpsText.includes('+4')) return 'fps-huge';
    if (fpsText.includes('+3') || fpsText.includes('+2')) return 'fps-med';
    if (fpsText.includes('+1') || fpsText.includes('+0')) return 'fps-low';
    return 'fps-lat';
}

function renderUI() {
    container.innerHTML = '';
    let totalCvars = 0;

    DATA.forEach((cat, catIdx) => {
        const catElem = document.createElement('div');
        catElem.className = 'category';
        catElem.id = `cat-${catIdx}`;

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `<span>${cat.category}</span><span style="font-size: 0.8rem; opacity: 0.7;">${cat.items.length} параметров</span>`;
        header.onclick = () => {
            const list = catElem.querySelector('.cvar-list');
            list.style.display = list.style.display === 'none' ? 'flex' : 'none';
        };

        const list = document.createElement('div');
        list.className = 'cvar-list';

        cat.items.forEach(item => {
            totalCvars++;
            const itemElem = document.createElement('div');
            itemElem.className = 'cvar-item';
            itemElem.dataset.name = item.name.toLowerCase();
            itemElem.dataset.desc = item.desc.toLowerCase();

            const fpsClass = getFpsBadgeClass(item.fps);

            itemElem.innerHTML = `
                <div class="cvar-name" title="${item.name}">${item.name}</div>
                <div class="cvar-input">
                    <input type="text" id="input_${item.name}" value="${item.val}" data-default="${item.def}" data-cfg="${item.val}" oninput="updateOutput()">
                </div>
                <div class="cvar-info">
                    ${item.desc}
                    <span class="cvar-def">Дефолт: "${item.def}"</span>
                </div>
                <div class="fps-badge ${fpsClass}" title="Влияние на частоту кадров и отзывчивость">${item.fps}</div>
            `;
            list.appendChild(itemElem);
        });

        catElem.appendChild(header);
        catElem.appendChild(list);
        container.appendChild(catElem);
    });

    document.getElementById('cvarCount').innerText = `${totalCvars} параметров`;
    updateOutput();
}

function updateOutput() {
    let out = `ConVars\n    {\n`;

    DATA.forEach(cat => {
        out += `\n        // ================ ${cat.category} ================\n`;
        cat.items.forEach(item => {
            const input = document.getElementById(`input_${item.name}`);
            const val = input ? input.value : item.val;
            
            // Форматирование табуляции
            const paddedName = item.name.padEnd(52, ' ');
            out += `        ${paddedName} "${val}" // def: "${item.def}" | FPS: ${item.fps}\n`;
        });
    });

    // Добавляем специализированные суб-блоки из оригинального файла (rate, speaker_config, voice_always_sample_mic)
    out += `\n        rate\n        {\n            min     "98304"\n            default "786432"\n            max     "1000000"\n        }\n`;
    out += `        voice_always_sample_mic\n        {\n            version "2"\n            default "0"\n        }\n`;
    out += `        speaker_config\n        {\n            min     "0"\n            default "0"\n            max     "2"\n        }\n`;

    out += `    }`;

    document.getElementById('outputArea').value = out;
}

function filterConVars() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const items = document.querySelectorAll('.cvar-item');
    
    items.forEach(el => {
        const name = el.dataset.name;
        const desc = el.dataset.desc;
        if (name.includes(q) || desc.includes(q)) {
            el.style.display = 'grid';
        } else {
            el.style.display = 'none';
        }
    });

    // Скрывать пустые категории при поиске
    document.querySelectorAll('.category').forEach(cat => {
        const visibleItems = cat.querySelectorAll('.cvar-item[style="display: grid;"], .cvar-item:not([style*="display: none"])');
        cat.style.display = visibleItems.length > 0 ? 'block' : 'none';
    });
}

function resetToConfig() {
    document.querySelectorAll('.cvar-input input').forEach(input => {
        input.value = input.dataset.cfg;
    });
    updateOutput();
    showToast('Сброшено к значениям OptimizationLock конфига!');
}

function resetToDefault() {
    document.querySelectorAll('.cvar-input input').forEach(input => {
        if (input.dataset.default && input.dataset.default !== 'null') {
            input.value = input.dataset.default;
        }
    });
    updateOutput();
    showToast('Сброшено к стандартным дефолтам игры!');
}

function copyToClipboard() {
    const textarea = document.getElementById('outputArea');
    textarea.select();
    navigator.clipboard.writeText(textarea.value).then(() => {
        showToast('✅ ConVars скопированы в буфер обмена!');
    });
}

function downloadTxt() {
    const text = document.getElementById('outputArea').value;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'gameinfo_convars.txt';
    link.click();
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2500);
}

// Старт инициализации
renderUI();
</script>
</body>
</html>
